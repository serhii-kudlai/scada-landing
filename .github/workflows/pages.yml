# Astro static site → GitHub Pages (NO Jekyll).
# If you see "Build with Jekyll" / jekyll-build-pages failing on .astro files:
# delete any other workflow that uses actions/jekyll-build-pages@v1 from this repo.

name: Deploy Astro site to Pages

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Optional: set CONTACT_API_URL secret in repo settings to enable
          # the contact form on GitHub Pages (must be a publicly accessible backend URL).
          PUBLIC_CONTACT_API: ${{ secrets.CONTACT_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
